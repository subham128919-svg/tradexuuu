<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chart</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#07080A; overflow:hidden; }
  #tv_container { width:100%; height:100%; }
</style>
</head>
<body>
<div id="tv_container"></div>

<script>
// ══════════════════════════════════════════════════════════════════
//  TradingView Advanced Chart Widget (FREE, no license needed)
//  This is the REAL TradingView chart with all indicators, drawing
//  tools, chart types etc. — the same widget used on financial sites.
//
//  Called from Android:
//    setSymbol('NSE', 'RELIANCE')  — loads a new stock
//    setInterval('D')               — changes timeframe
// ══════════════════════════════════════════════════════════════════

let currentSymbol   = 'NSE:RELIANCE';
let currentInterval = 'D';
let widget          = null;

function createWidget(symbol, interval) {
  // Clear previous
  document.getElementById('tv_container').innerHTML = '';

  const script = document.createElement('script');
  script.src   = 'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
  script.type  = 'text/javascript';
  script.async = true;
  script.innerHTML = JSON.stringify({
    "autosize":          true,
    "symbol":            symbol,
    "interval":          interval,
    "timezone":          "Asia/Kolkata",
    "theme":             "dark",
    "style":             "1",          // 1=candles
    "locale":            "en",
    "backgroundColor":   "#07080A",
    "gridColor":         "rgba(255,255,255,0.04)",
    "hide_top_toolbar":  false,
    "hide_legend":       false,
    "save_image":        false,
    "withdateranges":    true,
    "hide_side_toolbar": false,
    "allow_symbol_change": true,
    "details":           true,
    "hotlist":           false,
    "calendar":          false,
    "studies": [
      "STD;EMA",
      "STD;RSI"
    ],
    "support_host":      "https://www.tradingview.com"
  });

  const container = document.createElement('div');
  container.className = 'tradingview-widget-container';
  container.style.cssText = 'width:100%;height:100%';

  const inner = document.createElement('div');
  inner.className = 'tradingview-widget-container__widget';
  inner.style.cssText = 'width:100%;height:100%';

  container.appendChild(inner);
  container.appendChild(script);
  document.getElementById('tv_container').appendChild(container);
}

// Called from Android via evaluateJavascript
function setSymbol(exchange, symbol) {
  currentSymbol = exchange + ':' + symbol;
  createWidget(currentSymbol, currentInterval);
}

function setInterval(interval) {
  currentInterval = interval;
  createWidget(currentSymbol, currentInterval);
}

// Initial load — Android will call setSymbol() to override
createWidget(currentSymbol, currentInterval);

// Notify Android that chart is ready
if (typeof Android !== 'undefined') {
  setTimeout(function() { Android.onChartReady(); }, 2000);
}
</script>
</body>
</html>
