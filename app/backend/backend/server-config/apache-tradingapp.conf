# ─────────────────────────────────────────────────────────────────
#  Apache config for TradingApp
#  Place this file at: /etc/apache2/sites-available/tradingapp.conf
#  Then run:
#    sudo a2enmod proxy proxy_http proxy_wstunnel rewrite headers
#    sudo a2ensite tradingapp.conf
#    sudo systemctl restart apache2
# ─────────────────────────────────────────────────────────────────

<VirtualHost *:80>
    ServerName YOUR_SERVER_IP_OR_DOMAIN

    # ── Enable required Apache modules ──
    # (already done via a2enmod command above)

    # ── Proxy all /api/* requests to Node.js on port 3000 ──
    ProxyPreserveHost On
    ProxyPass        /api  http://localhost:3000/api
    ProxyPassReverse /api  http://localhost:3000/api

    # ── Proxy /health check ──
    ProxyPass        /health  http://localhost:3000/health
    ProxyPassReverse /health  http://localhost:3000/health

    # ── WebSocket proxy for live prices (/ws/prices) ──
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket  [NC]
    RewriteRule ^/ws/(.*)$  ws://localhost:3000/ws/$1  [P,L]

    # ── UDF data feed for TradingView Charting Library ──
    ProxyPass        /udf  http://localhost:3000/udf
    ProxyPassReverse /udf  http://localhost:3000/udf

    # ── phpMyAdmin is still accessible at /phpmyadmin ──
    # (it's served by Apache/PHP directly — no proxy needed)

    # ── Optional: serve a simple landing page at root ──
    DocumentRoot /var/www/html

    ErrorLog  ${APACHE_LOG_DIR}/tradingapp_error.log
    CustomLog ${APACHE_LOG_DIR}/tradingapp_access.log combined
</VirtualHost>
