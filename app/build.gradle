android {
    namespace         'com.tradingapp'
    compileSdk        34
    defaultConfig {
        applicationId "com.tradingapp"
        minSdk         26
        targetSdk      34
        versionCode    1
        versionName    "1.0"
        buildConfigField "String", "BASE_URL", '"https://tradingstock.online/api/v1/"'
        buildConfigField "String", "WS_URL",   '"wss://tradingstock.online/ws/prices"'


    }
    buildFeatures { viewBinding true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

